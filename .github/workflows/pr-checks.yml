# Verificaciones automáticas de la Definition of Done (docs/DEFINITION_OF_DONE.md, sección 5).
# Marcar estos jobs como "required status checks" en la protección de main y develop.
# Requiere en el package.json raíz los scripts: lint, format:check, typecheck, test:coverage, build, depcruise.
name: PR checks

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  convenciones:
    name: Rama y título del PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar nombre de rama y título
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Excepción controlada para Pull Requests automáticos de Dependabot
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            if [ "$BASE" != "develop" ]; then
              fail "Los Pull Requests de Dependabot deben dirigirse exclusivamente a 'develop' (recibido base: '$BASE')."
            fi
            if [[ ! "$HEAD" =~ ^dependabot/ ]]; then
              fail "Rama de Dependabot inválida (recibido: '$HEAD'). Debe comenzar con 'dependabot/'."
            fi
            if [[ ! "$TITLE" =~ ^(chore|ci|build)\(deps(-dev)?\):\ .+ ]]; then
              fail "Título de Dependabot inválido ('$TITLE'). Debe cumplir '^(chore|ci|build)(deps(-dev)?): .+'."
            fi
            echo "Convenciones de Dependabot correctas."
            exit 0
          fi

          if [ "$BASE" = "develop" ]; then
            # Ramas de trabajo (o merge de vuelta de release/hotfix)
            if [[ "$HEAD" =~ ^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Merge de vuelta de $HEAD a develop"; exit 0
            fi
            [[ "$HEAD" =~ ^(feature|fix|bug|docs|refactor|test|chore)/HU-[0-9]{3}-[a-z0-9-]+$ ]] \
              || fail "Rama '$HEAD' inválida. Formato: tipo/HU-xxx-descripcion (tipos: feature, fix, bug, docs, refactor, test, chore)."
            [[ "$TITLE" =~ ^(feat|fix|docs|refactor|test|chore|perf|build|ci)\([a-z0-9-]+\):\ HU-[0-9]{3}\ .+ ]] \
              || fail "Título '$TITLE' inválido. Formato: tipo(módulo): HU-xxx descripción"
            HU_RAMA=$(echo "$HEAD" | grep -oE 'HU-[0-9]{3}')
            HU_TITULO=$(echo "$TITLE" | grep -oE 'HU-[0-9]{3}' | head -1)
            [ "$HU_RAMA" = "$HU_TITULO" ] || fail "La HU de la rama ($HU_RAMA) no coincide con la del título ($HU_TITULO)."
          elif [ "$BASE" = "main" ]; then
            if [[ "$HEAD" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              V="${BASH_REMATCH[1]}"
              [[ "$TITLE" =~ ^release:\ v$V ]] || fail "Título debe empezar con 'release: v$V'."
            elif [[ "$HEAD" =~ ^hotfix/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              V="${BASH_REMATCH[1]}"
              [[ "$TITLE" =~ ^fix\([a-z0-9-]+\):\ hotfix\ v$V\ .+ ]] || fail "Título debe ser 'fix(módulo): hotfix v$V descripción'."
            else
              fail "A main solo llegan ramas release/X.Y.Z o hotfix/X.Y.Z (recibido: '$HEAD')."
            fi
          fi
          echo "Convenciones correctas."

  estaticas:
    name: Calidad · Estáticas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: convenciones
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/oeag_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Paridad de variables de entorno
        run: pnpm check:env-parity
      - name: Verificación de rutas de Windows
        run: pnpm check:windows-paths
      - name: Verificación de patrones de pruebas
        run: pnpm check:test-patterns
      - name: Lint y formato
        run: pnpm lint && pnpm format:check
      - name: Typecheck (TypeScript estricto)
        run: pnpm typecheck
      - name: Arquitectura hexagonal (dependency-cruiser)
        run: pnpm depcruise
      - name: Build
        run: pnpm build

  unitarias:
    name: Calidad · Unitarias con cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: convenciones
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/oeag_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pruebas con cobertura (umbral 80 % en vitest.config)
        run: |
          mkdir -p tmp/ci-reports
          pnpm build:shared && pnpm db:generate
          pnpm --filter backend test:coverage --reporter=default --reporter=json --outputFile.json=${{ github.workspace }}/tmp/ci-reports/unit-backend.json
          pnpm --filter frontend test:coverage --reporter=default --reporter=json --outputFile.json=${{ github.workspace }}/tmp/ci-reports/unit-frontend.json
          pnpm --filter @sigoa/shared --if-present test:coverage
      - name: Publicar resumen de pruebas más lentas (unitarias)
        if: ${{ !cancelled() }}
        run: node scripts/ci/ci-summary.mjs --mode tests --vitest tmp/ci-reports/unit-backend.json,tmp/ci-reports/unit-frontend.json
      - name: Verificar presupuesto por prueba (unitarias)
        run: node scripts/ci/check-perf-budget.mjs --tier unit --vitest tmp/ci-reports/unit-backend.json,tmp/ci-reports/unit-frontend.json

  integracion:
    name: Calidad · Integración (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: convenciones
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: oeag_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHARDS: 2
      DATABASE_URL: postgresql://test:test@localhost:5432/oeag_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preparar paquetes compartidos y cliente Prisma
        run: pnpm build:shared && pnpm db:generate
      - name: Migraciones desde cero
        run: pnpm --filter backend prisma migrate deploy
      - name: Pruebas de integración (shard ${{ matrix.shard }}/2)
        run: |
          mkdir -p tmp/integration-blobs
          pnpm --filter backend exec vitest run --project integration --shard=${{ matrix.shard }}/${{ env.SHARDS }} --exclude src/test/db/worker-isolation.integration.test.ts --reporter=blob --outputFile=${{ github.workspace }}/tmp/integration-blobs/blob-${{ matrix.shard }}.json
      - name: Estabilidad del PDF con Chromium (3 pasadas)
        if: matrix.shard == 1
        run: |
          for i in 1 2 3; do
            echo "==> Pasada $i de 3: prueba de integración del PDF con Chromium real..."
            pnpm --filter backend exec vitest run --project integration src/shared/pdf
          done
      - name: Subir informe blob de integración
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: integration-blob-${{ matrix.shard }}
          path: tmp/integration-blobs/
          retention-days: 7

  integracion-informe:
    name: Calidad · Informe de integración
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [integracion, aislamiento]
    if: ${{ !cancelled() }}
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/oeag_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preparar paquetes compartidos y cliente Prisma
        run: pnpm build:shared && pnpm db:generate
      - name: Descargar informes blob de integración
        uses: actions/download-artifact@v5
        with:
          pattern: integration-blob-*
          path: tmp/integration-blobs
          merge-multiple: true
      - name: Descargar informe de aislamiento de integración
        uses: actions/download-artifact@v5
        with:
          name: isolation-integration-report
          path: tmp/ci-reports
      - name: Combinar informes de integración y verificar completitud
        run: |
          mkdir -p tmp/ci-reports
          pnpm --filter backend exec vitest --merge-reports=${{ github.workspace }}/tmp/integration-blobs --reporter=default --reporter=json --outputFile.json=${{ github.workspace }}/tmp/ci-reports/integration-report.json
          pnpm --silent --filter backend exec vitest list --project integration --json > tmp/ci-reports/integration-expected.json
          node scripts/ci/check-shard-completeness.mjs --tool vitest --expected tmp/ci-reports/integration-expected.json --actual tmp/ci-reports/integration-report.json --extra tmp/ci-reports/isolation-integration.json
      - name: Publicar resumen de pruebas más lentas (integración)
        if: ${{ !cancelled() }}
        run: node scripts/ci/ci-summary.mjs --mode tests --vitest tmp/ci-reports/integration-report.json
      - name: Verificar presupuesto por prueba (integración)
        run: node scripts/ci/check-perf-budget.mjs --tier integration --vitest tmp/ci-reports/integration-report.json

  aislamiento:
    name: Calidad y E2E · Aislamiento de workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: convenciones
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: oeag_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/oeag_test
      NODE_ENV: test
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preparar paquetes compartidos y cliente Prisma
        run: pnpm build:shared && pnpm db:generate
      - name: Migraciones desde cero
        run: pnpm --filter backend prisma migrate deploy
      - name: Prueba de aislamiento de workers (integración)
        run: |
          mkdir -p tmp/ci-reports
          pnpm --filter backend exec vitest run --project integration src/test/db/worker-isolation.integration.test.ts --reporter=default --reporter=json --outputFile.json=${{ github.workspace }}/tmp/ci-reports/isolation-integration.json
      - name: Subir informe de aislamiento de integración
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: isolation-integration-report
          path: tmp/ci-reports/isolation-integration.json
          retention-days: 7
      - name: Instalar navegadores de Playwright con dependencias
        if: github.base_ref == 'develop' || (github.base_ref == 'main' && startsWith(github.head_ref, 'release/'))
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Prueba de aislamiento de workers (E2E)
        if: github.base_ref == 'develop' || (github.base_ref == 'main' && startsWith(github.head_ref, 'release/'))
        env:
          E2E_WORKERS: 2
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/tmp/ci-reports/isolation-e2e.json
        run: pnpm test:e2e e2e/worker-isolation.spec.ts --reporter=list,json
      - name: Subir informe de aislamiento E2E
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (github.base_ref == 'develop' || (github.base_ref == 'main' && startsWith(github.head_ref, 'release/'))) }}
        with:
          name: isolation-e2e-report
          path: tmp/ci-reports/isolation-e2e.json
          retention-days: 7

  seguridad:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: convenciones
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (falla con vulnerabilidades altas o críticas)
        run: pnpm audit --audit-level high

  imagenes:
    name: Construcción, endurecimiento e imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: convenciones
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validar endurecimiento de Docker Compose
        run: docker compose --env-file deploy/stack.env.example -f docker-compose.prod.yml config --format json | node scripts/ci/verify-compose-hardening.mjs
      - name: Pruebas de humo de imágenes Docker y PDF Open Sans
        run: bash scripts/ci/smoke-image.sh
      - name: Prueba de despliegue desde cero (migrate, seed y primer administrador)
        run: bash scripts/ci/smoke-fresh-deploy.sh
      - name: Diagnóstico del entorno host y Docker ante fallos
        if: failure()
        run: |
          echo "=== DIAGNÓSTICO DEL ENTORNO ==="
          echo "Kernel: $(uname -r)"
          docker version
          echo "Docker Security Options: $(docker info --format '{{.SecurityOptions}}')"
          echo "Sysctl unprivileged user namespaces:"
          sysctl kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true

  calidad:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    if: always()
    needs: [convenciones, estaticas, unitarias, integracion, integracion-informe, aislamiento]
    steps:
      - uses: actions/checkout@v7
      - name: Publicar tiempos por job en el resumen del PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-summary.mjs --mode jobs --run-id ${{ github.run_id }}
      - name: Verificar estado de jobs requeridos de calidad
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # Verificar estado agregado de jobs requeridos (NEEDS_RESULTS)
          if [ -z "${NEEDS_RESULTS:-}" ]; then
            echo "::error::Sin resultados de dependencias."
            exit 1
          fi
          for r in $NEEDS_RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Uno o más jobs requeridos de calidad fallaron o fueron cancelados ($NEEDS_RESULTS)."
              exit 1
            fi
          done

  e2e-shards:
    name: E2E · Shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.base_ref == 'develop' || (github.base_ref == 'main' && startsWith(github.head_ref, 'release/'))
    needs: convenciones
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: oeag_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHARDS: 3
      DATABASE_URL: postgresql://test:test@localhost:5432/oeag_test
      NODE_ENV: test
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar navegadores de Playwright con dependencias
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Ejecutar pruebas E2E (shard ${{ matrix.shard }}/3)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ env.SHARDS }} --grep-invert "Worker isolation" --reporter=blob
      - name: Subir informe blob del shard E2E
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: apps/frontend/blob-report/
          retention-days: 7
      - name: Subir resultados de Playwright en fallo
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: apps/frontend/test-results/
          retention-days: 7

  e2e-informe:
    name: E2E · Informe combinado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [e2e-shards, aislamiento]
    if: ${{ !cancelled() && (github.base_ref == 'develop' || (github.base_ref == 'main' && startsWith(github.head_ref, 'release/'))) }}
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/oeag_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Descargar informes blob de los shards E2E
        uses: actions/download-artifact@v5
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Descargar informe de aislamiento E2E
        uses: actions/download-artifact@v5
        with:
          name: isolation-e2e-report
          path: tmp/ci-reports
      - name: Combinar informes E2E y verificar completitud de shards
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/tmp/ci-reports/e2e-report.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/apps/frontend/playwright-report
        run: |
          mkdir -p tmp/ci-reports
          pnpm --filter frontend exec playwright merge-reports --reporter=html --reporter=json ../../all-blob-reports
          PLAYWRIGHT_JSON_OUTPUT_NAME=${{ github.workspace }}/tmp/ci-reports/e2e-expected.json pnpm --silent --filter frontend exec playwright test --list --reporter=json > /dev/null
          node scripts/ci/check-shard-completeness.mjs --tool playwright --expected tmp/ci-reports/e2e-expected.json --actual tmp/ci-reports/e2e-report.json --extra tmp/ci-reports/isolation-e2e.json
      - name: Publicar resumen de pruebas más lentas y reintentadas (E2E)
        if: ${{ !cancelled() }}
        run: node scripts/ci/ci-summary.mjs --mode tests --playwright tmp/ci-reports/e2e-report.json
      - name: Verificar presupuesto por prueba (E2E)
        run: node scripts/ci/check-perf-budget.mjs --tier e2e --playwright tmp/ci-reports/e2e-report.json
      - name: Subir reporte HTML combinado de Playwright
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  e2e:
    name: Pruebas end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    if: always() && (github.base_ref == 'develop' || (github.base_ref == 'main' && startsWith(github.head_ref, 'release/')))
    needs: [e2e-shards, e2e-informe, aislamiento]
    steps:
      - uses: actions/checkout@v7
      - name: Publicar tiempos por job E2E en el resumen del PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-summary.mjs --mode jobs --run-id ${{ github.run_id }}
      - name: Verificar estado de jobs E2E
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # Verificar estado agregado de jobs requeridos (NEEDS_RESULTS)
          if [ -z "${NEEDS_RESULTS:-}" ]; then
            echo "::error::Sin resultados de dependencias."
            exit 1
          fi
          for r in $NEEDS_RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Uno o más jobs E2E fallaron o fueron cancelados ($NEEDS_RESULTS)."
              exit 1
            fi
          done
