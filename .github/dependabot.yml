version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'America/Lima'
    target-branch: 'develop'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'America/Lima'
    target-branch: 'develop'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      prefix-development: 'ci'
      include: 'scope'
    groups:
      actions-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
