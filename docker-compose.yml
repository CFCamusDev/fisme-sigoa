name: fisme-sigoa

services:
  postgres:
    image: postgres:16
    restart: always
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    environment:
      POSTGRES_DB: ${DB_NAME:-sigoa_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sigoa_dev}']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migrator
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-sigoa_dev}?schema=public

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - '${SERVER_PORT:-3000}:${SERVER_PORT:-3000}'
    shm_size: 256m
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: ${SERVER_PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-sigoa_dev}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8001}:80'
    depends_on:
      backend:
        condition: service_healthy

  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-sigoa_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-0}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-0}
    volumes:
      - pg_backups:/backups

volumes:
  pg_data:
  pg_backups:
